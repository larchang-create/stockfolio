<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="results">RUNNING</pre><iframe src="../public/" style="width:1400px;height:1100px"></iframe><script>
document.querySelector('iframe').onload=()=>{const w=document.querySelector('iframe').contentWindow,d=w.document;const results=[];const assert=(x,m)=>{if(!x)throw Error(m);results.push('PASS '+m)};const click=s=>d.querySelector(s).click();const quick=(market,symbol)=>{click('#add');d.querySelector('#quick-market').value=market;d.querySelector('#quick-symbol').value=symbol;d.querySelector('#quick-form').requestSubmit()};try{
w.localStorage.clear();assert(d.querySelectorAll('nav [data-view]').length===3,'three clear navigation sections');click('#demo');assert(d.querySelectorAll('#rows tr').length===1,'Taiwan view only shows Taiwan stocks');click('[data-view="us"]');assert(d.querySelector('#rows').textContent.includes('DEMO-US')&&!d.querySelector('#rows').textContent.includes('DEMO-TW'),'US view isolates stocks');
click('[data-view="macro"]');assert(d.querySelector('#market-content').hidden&&!d.querySelector('#macro-content').hidden&&d.querySelector('#add').hidden,'macro has its own content');assert(d.querySelector('#macro-content').textContent.includes('尚未串接'),'macro does not present fabricated data');click('[data-view="tw"]');
click('#add');assert(d.querySelector('#quick-market').value==='台股','add defaults to active market');assert(d.querySelectorAll('#quick-form input,#quick-form select').length===2,'add only asks for market and symbol');click('#quick-cancel');
quick('台股','0050');let saved=JSON.parse(w.localStorage.getItem('stockfolio-v1'));let item=saved.find(x=>x.symbol==='0050');assert(item&&item.watch&&item.price===null,'add with symbol only preserves leading zero and unknown price');assert(!d.querySelector('#quick-add').open,'successful add closes dialog');
quick('美股',' aapl ');saved=JSON.parse(w.localStorage.getItem('stockfolio-v1'));assert(saved.find(x=>x.symbol==='AAPL')&&d.querySelector('[data-view="us"]').classList.contains('active'),'US add normalizes ticker and switches market');const before=saved.length;quick('美股','AAPL');assert(d.querySelector('#quick-add').open&&d.querySelector('#quick-error').textContent.includes('已在'),'duplicate gives inline feedback');assert(JSON.parse(w.localStorage.getItem('stockfolio-v1')).length===before,'duplicate does not add record');click('#quick-close');
quick('台股','AAPL');assert(d.querySelector('#quick-error').textContent.includes('台股代號'),'wrong market symbol format rejected');click('#quick-close');
item=JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL');click('[data-edit="'+item.id+'"]');const f=d.querySelector('#stock-form');f.elements.name.value='<img src=x onerror=alert(1)>';f.elements.notes.value='research';f.requestSubmit();assert(!d.querySelector('#rows img'),'research content is escaped');click('[data-edit="'+item.id+'"]');click('#review');const reviewed=JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL');assert(reviewed.history.length===1,'research review history still works');
d.querySelector('#pe').value='10';d.querySelector('#pe').dispatchEvent(new Event('input'));assert(d.querySelectorAll('#rows tr').length===0,'unknown PE fails numeric filter');click('[data-view="tw"]');assert(d.querySelector('#pe').value===''&&d.querySelectorAll('#rows tr').length===2,'switch clears stale filters');assert(w.parseCSV('a,b\n"x,y","q""z"')[1][1]==='q"z','CSV quoting supported');w.localStorage.clear();d.querySelector('#results');document.querySelector('#results').textContent=results.join('\n')+'\nALL PASSED';
}catch(e){document.querySelector('#results').textContent=results.join('\n')+'\nFAIL '+e.message}}
</script></body></html>
