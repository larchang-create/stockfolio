<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="results">RUNNING</pre><iframe src="../public/" style="width:1400px;height:1100px"></iframe><script>
document.querySelector('iframe').onload=async()=>{const w=document.querySelector('iframe').contentWindow,d=w.document;const results=[];const assert=(x,m)=>{if(!x)throw Error(m);results.push('PASS '+m)};const click=s=>d.querySelector(s).click();const quick=(market,symbol)=>{click('#add');d.querySelector('#quick-market').value=market;d.querySelector('#quick-symbol').value=symbol;d.querySelector('#quick-form').requestSubmit()};try{
w.localStorage.clear();assert(d.querySelectorAll('nav [data-view]').length===4,'four clear navigation sections');click('#demo');assert(d.querySelectorAll('#rows tr').length===1,'Taiwan view only shows Taiwan stocks');click('[data-view="us"]');assert(d.querySelector('#rows').textContent.includes('DEMO-US')&&!d.querySelector('#rows').textContent.includes('DEMO-TW'),'US view isolates stocks');

quick('美股',' aapl ');saved=JSON.parse(w.localStorage.getItem('stockfolio-v1'));assert(saved.find(x=>x.symbol==='AAPL')&&d.querySelector('[data-view="us"]').classList.contains('active'),'US add normalizes ticker and switches market');const before=saved.length;quick('美股','AAPL');assert(d.querySelector('#quick-add').open&&d.querySelector('#quick-error').textContent.includes('已在'),'duplicate gives inline feedback');assert(JSON.parse(w.localStorage.getItem('stockfolio-v1')).length===before,'duplicate does not add record');click('#quick-close');
quick('台股','AAPL');assert(d.querySelector('#quick-error').textContent.includes('台股代號'),'wrong market symbol format rejected');click('#quick-close');
item=JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL');click('[data-expand="'+item.id+'"]');click('[data-edit="'+item.id+'"]');const f=d.querySelector('#stock-form');f.elements.name.value='<img src=x onerror=alert(1)>';f.elements.notes.value='research';f.requestSubmit();assert(!d.querySelector('#rows img'),'research content is escaped');click('[data-expand="'+item.id+'"]');click('[data-edit="'+item.id+'"]');click('#review');const reviewed=JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL');assert(reviewed.history.length===1,'research review history still works');

item=JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL');d.querySelector('#research-stock').value=item.id;click('#research-open');assert(!d.querySelector('#research-save').disabled,'selected stock enables research draft');d.querySelector('#research-thesis').value='test hypothesis';d.querySelector('#research-thesis').dispatchEvent(new Event('input',{bubbles:true}));d.querySelector('[data-section="0"][data-field="summary"]').value='business model draft';d.querySelector('[data-section="0"][data-field="summary"]').dispatchEvent(new Event('input',{bubbles:true}));assert(d.querySelector('#research-progress').textContent==='1 / 6','progress responds to filled sections');d.querySelector('#research-form').requestSubmit();let researchSaved=JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL');assert(researchSaved.research.thesis==='test hypothesis'&&researchSaved.research.sections[0].summary==='business model draft','research is persisted on stock record');assert(w.normalize(researchSaved).research.sections[0].summary==='business model draft','normalization preserves research for reload and backup');click('[data-view="us"]');click('[data-expand="'+item.id+'"]');assert(d.querySelector('.stock-details').textContent.includes('尚未取得'),'stock detail states no data have been fetched');click('.stock-details [data-research]');assert(d.querySelector('#research-thesis').value==='test hypothesis','stock research shortcut restores saved draft');click('#research-expand');assert(Array.from(d.querySelectorAll('.research-section')).every(x=>x.open),'expand all sections');click('#research-expand');assert(Array.from(d.querySelectorAll('.research-section')).every(x=>!x.open),'collapse all sections');click('#research-preview');assert(d.querySelector('#research-save').disabled&&d.querySelector('#research-thesis').value==='','preview is separate from saved company draft');assert(!d.querySelector('.academy-banner')&&!d.querySelector('.notes-grid'), );click('#research-analyze');await new Promise(r=>setTimeout(r,100));assert(JSON.parse(w.localStorage.getItem('stockfolio-v1')).find(x=>x.symbol==='AAPL').analysis.business==='fixture business','provider failure preserves prior report');w.eval("serviceConfig=null");click('#research-analyze');assert(d.querySelector('#toast').textContent.includes('下一步'),'research waits until the sync phase is complete');w.eval("syncStatus('conflict',[{path:'美股:MSFT.notes',local:'<img src=x>',remote:'cloud note'}])");assert(d.querySelector('#sync-conflict').open&&!d.querySelector('#conflict-list img'),'conflicts are visible and safely escaped');d.querySelector('#sync-conflict').close();const loginFrame=document.createElement('iframe');loginFrame.hidden=true;document.body.append(loginFrame);await new Promise(resolve=>{loginFrame.onload=resolve;loginFrame.src='../public/login.html'});const lw=loginFrame.contentWindow,ld=lw.document;await new Promise(resolve=>setTimeout(resolve,120));lw.fetch=async()=>new lw.Response(JSON.stringify({passwordReady:false,databaseReady:true}),{status:200});await lw.setup();assert(ld.querySelector('#login-form').hidden&&!ld.querySelector('#login-setup').hidden,'first visit explains only the one-time website password setup');assert(!ld.querySelector('input[type=email]'),'personal login needs no email provider');for(const [state,message] of [['missing','尚未收到'],['too_short','少於 16']]){lw.fetch=async()=>new lw.Response(JSON.stringify({passwordReady:false,passwordState:state,databaseReady:true}),{status:200});await lw.setup();assert(ld.querySelector('#login-description').textContent.includes(message),'setup identifies '+state+' without displaying the secret')}lw.fetch=async()=>new lw.Response(JSON.stringify({passwordReady:true,passwordState:'ready',databaseReady:true}),{status:200});await lw.setup();assert(!ld.querySelector('#login-form').hidden&&ld.querySelector('#login-setup').hidden,'rechecking a saved password restores the login form');ld.querySelector('#login-form').hidden=false;ld.querySelector('#login-setup').hidden=true;lw.fetch=async(url,options)=>{if(url==='/api/setup')return new lw.Response(JSON.stringify({passwordReady:true,databaseReady:true}),{status:200});assert(options.credentials==='same-origin'&&options.method==='POST','password login uses same-origin session cookies');return new lw.Response(JSON.stringify({error:'密碼不正確，請再試一次。'}),{status:401})};ld.querySelector('#login-password').value='test-fixture-password';ld.querySelector('#login-form').requestSubmit();await new Promise(resolve=>setTimeout(resolve,60));assert(ld.querySelector('#login-error').textContent.includes('密碼不正確')&&!ld.querySelector('#login-submit').disabled,'wrong password gives feedback and allows retry');assert(!JSON.stringify({...lw.localStorage}).includes('test-fixture-password'),'password is not saved in browser storage');loginFrame.remove();w.fetch=originalFetch;w.localStorage.clear();w.sessionStorage.clear();document.querySelector('#results').textContent=results.join('\n')+'\nALL PASSED';
}catch(e){document.querySelector('#results').textContent=results.join('\n')+'\nFAIL '+e.message}}
