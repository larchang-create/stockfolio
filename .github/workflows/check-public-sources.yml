name: Check official public sources
on:
  push:
    branches: [main]
    paths:
      - 'backend/public-data*.mjs'
      - 'scripts/check-public-sources.mjs'
      - '.github/workflows/check-public-sources.yml'
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public sources with fixed examples
        continue-on-error: true
        run: node scripts/check-public-sources.mjs
