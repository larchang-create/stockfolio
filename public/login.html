<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182f2b"><title>登入｜拾股 Stockfolio</title><link rel="stylesheet" href="style.css?v=6"><script src="login.js?v=7" defer></script></head><body class="login-page"><section class="login-card"><div class="eyebrow">STOCKFOLIO</div><h1>回到你的觀察名單。</h1><p id="login-description">登入後，電腦與手機共用同一份名單和研究筆記。</p><form id="login-form" hidden><label>網站密碼<input id="login-password" type="password" required maxlength="256" autocomplete="current-password" autofocus></label><button id="login-submit" type="submit" class="primary">登入</button></form><p id="login-error" role="alert" aria-live="polite"></p><button id="login-retry" type="button" hidden>重新檢查設定</button><details id="login-setup" hidden><summary>完成一次設定</summary><p>回到 Cloudflare → Workers & Pages → stockfolio → Settings → Variables and Secrets，新增網站執行用的 Secret（不是 Build 區塊內的變數）：</p><p>名稱：<strong>SITE_PASSWORD</strong><br>內容：自己設定至少 16 個字元的網站密碼。</p><p>儲存並部署後重新整理。密碼只在 Cloudflare 設定，不必傳給任何人。</p></details></section></body></html>
